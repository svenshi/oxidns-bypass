# OxiDNS Bypass - RouterOS static route 方案
#
# 官方原生安装器部署时复制为 /opt/oxidns/config.yaml：
#   cp config.ros_route.yaml /opt/oxidns/config.yaml
#
# 该方案不使用 address-list/mangle。RouterOS 必须预先创建 policy_table，并用
# action=lookup 的 routing rule 让指定客户端先查该表；表内不要添加默认路由。

log:
  level: info

api:
  http:
    listen: "172.16.2.53:9199"

plugins:
  # 缺少规则时在其它插件初始化前下载；运行后每天 04:17 自动刷新。
  # GitHub 访问不需要代理时，删除 socks5 配置即可。
  - tag: rules_download
    type: download
    args:
      timeout: 120s
      startup_if_missing: true
      socks5: "172.16.2.40:7890"
      downloads:
        - url: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
          dir: "./rules"
          filename: "geosite.dat"

  - tag: geosite_direct
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "cn"
        - "apple-cn"
        - "apple"
        - "category-games@cn"

  - tag: geosite_policy
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "geolocation-!cn"

  - tag: direct_domains
    type: domain_set
    args:
      exps:
        - "domain:steamserver.net"
        - "domain:controlplane.tailscale.com"
        - "domain:log.tailscale.io"
        - "domain:speedtest.im"
        - "domain:solidigm-nvme.com"
        - "domain:mountblade.com.cn"
        - "domain:apple.com"
        - "domain:apple.cn"
        - "domain:windowsupdate.com"
        - "domain:windows.com"
        - "domain:fdnssc.com"
      sets:
        - "geosite_direct"

  - tag: policy_domains
    type: domain_set
    args:
      exps:
        - "domain:mikrotik.com"
        - "domain:cloudflare.com"
      sets:
        - "geosite_policy"

  - tag: reload_rule_providers
    type: reload_provider
    args:
      - "$geosite_direct"
      - "$geosite_policy"

  - tag: rules_refresh
    type: sequence
    args:
      - exec: "$rules_download"
      - exec: "$reload_rule_providers"

  - tag: rules_cron
    type: cron
    args:
      timezone: "Asia/Shanghai"
      jobs:
        - name: refresh_geosite
          schedule: "17 4 * * *"
          executors:
            - "$rules_refresh"

  - tag: cache
    type: cache
    args:
      size: 5120
      dump_file: "./cache.dump"
      short_circuit: true

  - tag: forward_direct
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "udp://61.139.2.69:53"
        - addr: "udp://218.6.200.139:53"
        - addr: "udp://223.5.5.5:53"

  - tag: forward_policy
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://1.1.1.1/dns-query"
          socks5: "172.16.2.40:7890"
        - addr: "https://8.8.8.8/dns-query"
          socks5: "172.16.2.40:7890"

  - tag: policy_fallback
    type: fallback
    args:
      primary: forward_policy
      secondary: forward_direct
      threshold: 500
      always_standby: false

  # 把策略域名的最终 IPv4 应答写成 policy_table 中的 /32 静态路由。
  - tag: policy_route
    type: ros_route
    args:
      address: "172.16.1.1:8728"
      username: "oxidns"
      password: "${ROUTEROS_PASSWORD:-change-me}"
      connect_timeout: 5
      send_timeout: 5
      receive_timeout: 5
      async: true
      wait_timeout: 8s
      queue_capacity: 16384
      routing_table: "policy_table"
      # @main 表示下一跳在 main 表中解析，适用于旁路由网关。
      gateway4: "172.16.2.40@main"
      # 如需 IPv6，请先完成 RouterOS IPv6 网关与 routing rule，再启用：
      # gateway6: "fe80::2%ether1"
      distance: 100
      comment_prefix: "oxi"
      min_ttl: 60
      max_ttl: 3600
      conntrack_guard: true
      # 保留路由跨越正常重启/reload，下次启动会从 comment 恢复租约。
      cleanup_on_shutdown: false

  - tag: direct_sequence
    type: sequence
    args:
      - exec: "$cache"
      - matches: "!has_resp"
        exec: "$forward_direct"
      - matches: "has_resp"
        exec: accept
      - exec: "reject SERVFAIL"

  - tag: policy_sequence
    type: sequence
    args:
      - exec: "$policy_route"
      - exec: "$cache"
      - matches: "!has_resp"
        exec: "$policy_fallback"
      - matches: "has_resp"
        exec: accept
      - exec: "reject SERVFAIL"

  - tag: main_sequence
    type: sequence
    args:
      - matches: "qname $direct_domains"
        exec: "goto direct_sequence"
      - matches: "qname $policy_domains"
        exec: "goto policy_sequence"
      # 未分类域名默认按策略域名处理，避免新域名意外绕过策略出口。
      - exec: "goto policy_sequence"

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: "0.0.0.0:5335"

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: "0.0.0.0:5335"
